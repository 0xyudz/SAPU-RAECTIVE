[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
remappings = [
    "@reactive/=lib/reactive/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# Surface high- and medium-severity findings only. The remaining `note[...]` hits are
# advisory style hints about idioms this codebase uses deliberately, and leaving them
# on would make `forge build` exit non-zero for reasons that are not defects:
#
#   reentrancy-events     — state is written before each external call by design, so a
#                           reentrant path never observes a half-torn-down registry.
#                           The emit-after-call is the consequence of that ordering.
#   costly-loop/calls-loop — pause()/unpause() must touch every tracked subscription.
#                           There is no bounded form of "unsubscribe everything".
#   unsafe-typecast       — uint64(block.number) is guarded by a range check on the line
#                           above; topic→address truncation is exact because the node
#                           normalises an indexed address into 160 bits.
severity = ["high", "med"]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }
invariant = { runs = 256, depth = 64 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
reactive_lasna = "${REACTIVE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
